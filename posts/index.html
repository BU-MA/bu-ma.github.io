<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUMA - Posts</title>


    <link rel="stylesheet" href="/src/styles/talks.css">
    <link rel="icon" type="image/png" href="/src/assets/logo.png">

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="/src/misc-js/load-theme.js"></script> <!-- load the currently active theme -->
    <script src="/src/misc-js/scroll-reveal.js" defer></script> <!-- scroll reveal effect -->
    <script src="/src/components/load-components.js" defer></script>
    <script src="/src/misc-js/theme-switcher.js" defer></script>
    <script src="/src/leadership/leadership.js" defer></script>
    <script src="/src/posts/posts.js" defer></script>
</head>
<body>

<header class="site-nav" id="siteNav">
    <div class="site-nav-inner">
        <span class="brand text-full">Boston University Mathematics Association</span>
        <span class="brand text-mobile">BUMA</span>
        <nav data-page="posts" aria-label="Primary"></nav>
    </div>
</header>

<div class="page-hero">
    <div class="hero-field" aria-hidden="true">
        <span class="floater f1">\( \S \)</span>
        <span class="floater f2">\( \bigwedge^nV \)</span>
        <span class="floater f3">\( \mathbb{S}^n \)</span>
        <span class="floater f4">\( \Longrightarrow \)</span>
    </div>
    <div class="hero-inner">
        <h1>Posts</h1>
        <p class="hero-sub">
            Our blog! Here we post talk notes, Putnam problem solutions, discussions of the <i>theorem of the week</i>,
            newsletters, competition results, any big changes to the club, and more!
        </p>
    </div>
</div>

<main>
    <div class="post-filters" role="group" aria-label="Filter posts by type">
        <button class="filter-button active" data-filter="all">All</button>
        <button class="filter-button" data-filter="talks">Talks</button>
        <button class="filter-button" data-filter="putnam">Putnam</button>
        <button class="filter-button" data-filter="theorem">Theorems</button>
        <button class="filter-button" data-filter="newsletter">Newsletters</button>
        <button class="filter-button" data-filter="competitions">Competitions</button>
    </div>
</main>

<footer></footer>

</body>
</html>
